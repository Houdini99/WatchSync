[package]
name = "watchsync-server"
version = "3.0.0"
edition = "2021"
description = "WatchSync — authoritative room/sync engine for a self-hosted watch-together app"
license = "MIT"

[[bin]]
name = "watchsync-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process", "fs", "io-util", "net"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
nanoid = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Optional account layer: SQLite for users/sessions/registered rooms. Kept off
# the sync hot path — the pool is only touched at auth/join/registry time.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
