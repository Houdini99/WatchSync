map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Don't leak the nginx version.
    server_tokens off;

    # Security headers. SSL/HSTS terminates at the upstream reverse proxy (NPM),
    # so set Strict-Transport-Security there. These cover everything else.
    # The CSP is deliberately permissive for media/connect because the whole
    # point is to play arbitrary direct video/HLS URLs the user pastes; scripts
    # and frames stay tightly locked to self + YouTube.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: data: https:; connect-src 'self' ws: wss: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "autoplay=(self), fullscreen=(self), picture-in-picture=(self), geolocation=(), microphone=(), camera=()" always;

    # The app's HTML/JS/CSS share stable filenames (no build hashing), so tell
    # browsers to revalidate every load. nginx answers with 304 when unchanged
    # (cheap), but a redeploy is picked up immediately — no more stale app.js/
    # style.css after an update. Versioned vendor libs under /lib/ stay immutable.
    add_header Cache-Control "no-cache" always;

    # Cache static assets (immutable libs only, not index/app)
    location /lib/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Socket.IO — websocket upgrade + long-polling fallback
    location /socket.io/ {
        proxy_pass http://watchsync-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # JSON API
    location /api/ {
        proxy_pass http://watchsync-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: room URLs (/r/<id>) fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
