services:
  watchsync-server:
    image: watchsync-server:latest
    pull_policy: never
    container_name: watchsync-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Lock this to your public https origin in production. "*" reflects any
      # origin (fine for testing). Comma-separate to allow several.
      - CORS_ORIGIN=${PUBLIC_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Optional tunables (defaults shown in server/src/config.js):
      # - MAX_USERS_PER_ROOM=50
      # - EMPTY_ROOM_TTL_MS=300000
      # - RECONNECT_GRACE_MS=12000
      # - CHAT_HISTORY_LIMIT=80
      # - ALLOWED_RATES=0.5,1,1.25,1.5,2
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  watchsync-client:
    image: watchsync-client:latest
    pull_policy: never
    container_name: watchsync-client
    restart: unless-stopped
    depends_on:
      watchsync-server:
        condition: service_started
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy:
    external: true
