map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Edge rate limiting. There was none anywhere in the stack: the only limiter
# was the app's, which (before the real_ip fix below) collapsed into a single
# global bucket. $binary_remote_addr is the post-realip client address, so
# these are genuinely per-client.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
# The socket gets its own zones: its connections are long-lived, and sharing
# `conn` with /api/ would let a burst of API calls lock sockets out (or the
# reverse).
limit_req_zone $binary_remote_addr zone=ws:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=wsconn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 4m was ~4000x the largest legitimate body (a username + password JSON).
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    server_tokens off;

    # Recover the real client IP from the edge proxy (NPM/Traefik/Caddy).
    #
    # Without this, $remote_addr is the EDGE PROXY's container address for
    # every request on earth, so `proxy_set_header X-Real-IP $remote_addr`
    # below handed the Rust server one constant string -- collapsing every
    # per-IP rate limit (room creation, resolver, and the argon2-backed login
    # limiter) into a single global bucket that any one user could exhaust for
    # everyone.
    #
    # The trusted set is the private ranges rather than a specific address
    # because the edge proxy is a container on a Docker network and its IP is
    # deployment-specific and unstable. `real_ip_recursive on` then walks
    # X-Forwarded-For from the right, skipping trusted hops, and stops at the
    # first untrusted address -- the real client. A client-supplied XFF entry
    # cannot promote itself past that, because everything to its right is a
    # hop nginx itself trusts.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1/128;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    # Without gzip_proxied, nginx does not compress PROXIED responses at all --
    # so every /api/ JSON body and every subtitle track (up to 3 MB of WebVTT)
    # went out uncompressed no matter what gzip_types said.
    gzip_proxied any;
    # HLS playlists are text, rewritten every few seconds, and compress ~10:1;
    # text/vtt is the subtitle payload. Both were missing.
    gzip_types text/plain text/css text/vtt application/javascript application/json
               image/svg+xml application/manifest+json application/vnd.apple.mpegurl;
    gzip_min_length 1024;

    # Security headers live in security-headers.conf and are `include`d into
    # EVERY location below rather than set once here.
    #
    # This is not redundancy -- it is the only thing that works. nginx inherits
    # add_header from an outer block ONLY into blocks that declare no add_header
    # of their own. Three locations here set their own Cache-Control, so a
    # server-level declaration would be silently dropped for all three --
    # including `location /`, which serves index.html. The result was an app
    # shipping with no CSP at all while the config appeared to set one.
    #
    # If you add a location, include the snippet in it too.
    include /etc/nginx/security-headers.conf;

    # Vite emits content-hashed assets under /assets — safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket sync channel → Rust server.
    location /ws {
        # The app rate-limits per connection, so without a cap here one client
        # could simply open more connections — each holds a task, a send queue
        # and, once joined, a room seat. A room page holds one socket; 16 per
        # address leaves room for a household behind one NAT with many tabs.
        # The upgrade rate absorbs the client's reconnect backoff (0.5s → 8s).
        limit_conn wsconn 16;
        limit_req zone=ws burst=10 nodelay;

        # watchsync-server-int, not watchsync-server: this container is on both
        # the edge `proxy` network and the private one, and Docker resolves a
        # name across all attached networks. A previous stack's container still
        # named "watchsync-server" on `proxy` would otherwise shadow ours
        # mid-rollout. The alias is declared in docker-compose.yml.
        proxy_pass http://watchsync-server-int:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # On-the-fly HLS, served straight off the shared RAM disk the Rust server
    # writes into (/dev/shm/streams/{room_id}/index.m3u8 + seg_*.ts). This is a
    # longer prefix than /api/ below, so nginx matches it first — but it is also
    # placed first for clarity. No upstream hop: these bytes never touch the Rust
    # process. The playlist is rewritten every few seconds, so it must never be
    # cached; the segments are immutable but ephemeral (wiped when the room is
    # reaped), so a short cache is plenty and we keep it simple with no-cache.
    location /api/streams/ {
        alias /dev/shm/streams/;
        autoindex off;

        # nginx's default mime.types has no HLS entries; declare them locally.
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        default_type application/octet-stream;

        # Same-origin with the SPA, so no CORS dance is needed; hls.js fetches
        # these via XHR which `connect-src 'self'` already permits. The playlist
        # is rewritten every few seconds so it must never be cached; segments are
        # immutable but ephemeral, so blanket no-cache keeps this simple and safe.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;

        # 404 instead of a directory listing for anything that isn't a real file.
        try_files $uri =404;
    }

    # JSON API → Rust server.
    location /api/ {
        # Edge rate limit, in front of the app's own per-IP buckets. burst
        # absorbs a page load's worth of parallel calls; nodelay serves the
        # burst immediately rather than queueing it.
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 24;

        proxy_pass http://watchsync-server-int:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # There was no timeout config here at all, so this inherited the 60s
        # default while the app used 45s and the resolver's retry ladder could
        # run to ~63s — three budgets, none aligned. Ordered
        # resolver < app < nginx so the innermost timeout is the one that fires
        # and the caller gets a real error rather than a truncated connection.
        proxy_connect_timeout 5s;
        proxy_send_timeout 70s;
        proxy_read_timeout 70s;
    }

    # SPA: room URLs (/r/<id>) and everything else fall through to index.html.
    # index.html itself must always revalidate so redeploys are picked up.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
