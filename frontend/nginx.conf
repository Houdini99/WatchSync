map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # SSL/HSTS terminates at the upstream reverse proxy (NPM/Traefik/Caddy), so
    # set Strict-Transport-Security there. Everything else is covered here.
    # The CSP is deliberately permissive for media/connect (the whole point is to
    # play arbitrary direct video/HLS URLs the user pastes); scripts and frames
    # stay locked to self + YouTube.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: data: https:; connect-src 'self' ws: wss: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "autoplay=(self), fullscreen=(self), picture-in-picture=(self), geolocation=(), microphone=(), camera=()" always;

    # Vite emits content-hashed assets under /assets — safe to cache forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket sync channel → Rust server.
    location /ws {
        proxy_pass http://watchsync-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # On-the-fly HLS, served straight off the shared RAM disk the Rust server
    # writes into (/dev/shm/streams/{room_id}/index.m3u8 + seg_*.ts). This is a
    # longer prefix than /api/ below, so nginx matches it first — but it is also
    # placed first for clarity. No upstream hop: these bytes never touch the Rust
    # process. The playlist is rewritten every few seconds, so it must never be
    # cached; the segments are immutable but ephemeral (wiped when the room is
    # reaped), so a short cache is plenty and we keep it simple with no-cache.
    location /api/streams/ {
        alias /dev/shm/streams/;
        autoindex off;

        # nginx's default mime.types has no HLS entries; declare them locally.
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        default_type application/octet-stream;

        # Same-origin with the SPA, so no CORS dance is needed; hls.js fetches
        # these via XHR which `connect-src 'self'` already permits. The playlist
        # is rewritten every few seconds so it must never be cached; segments are
        # immutable but ephemeral, so blanket no-cache keeps this simple and safe.
        add_header Cache-Control "no-cache" always;

        # 404 instead of a directory listing for anything that isn't a real file.
        try_files $uri =404;
    }

    # JSON API → Rust server.
    location /api/ {
        proxy_pass http://watchsync-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: room URLs (/r/<id>) and everything else fall through to index.html.
    # index.html itself must always revalidate so redeploys are picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
