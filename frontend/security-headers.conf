# Security headers, included into every location in nginx.conf.
#
# WHY THIS IS A SEPARATE FILE, INCLUDED REPEATEDLY:
# nginx's add_header directives are inherited from an outer block only if the
# current block declares NO add_header of its own. Any location that sets its
# own Cache-Control therefore silently drops every server-level security
# header. Repeating the include is the only mechanism nginx offers.
#
# SSL/HSTS terminates at the upstream reverse proxy (NPM/Traefik/Caddy), so set
# Strict-Transport-Security there, not here.
#
# The CSP is deliberately permissive for media/connect -- the whole point of the
# app is playing arbitrary direct video/HLS URLs the user pastes -- while
# scripts and frames stay locked to self + YouTube.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: data: https:; connect-src 'self' ws: wss: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "autoplay=(self), fullscreen=(self), picture-in-picture=(self), geolocation=(), microphone=(), camera=()" always;
